name: Governance guard

# Chặn ở phía server — nằm ngoài tầm với của AI đang chạy trên máy.
# AI sửa được file này trên máy, nhưng thay đổi đó hiện ra trong diff của PR,
# và chính PR đó lại bị check này soi. Muốn tắt lén thì phải tắt công khai.

on:
  pull_request:
    branches: [main]
    # `labeled`/`unlabeled` KHÔNG có trong danh sách mặc định. Thiếu nó thì gắn nhãn
    # xong chẳng có run mới nào chạy, phải bấm "Re-run" — mà re-run lại phát lại
    # payload cũ (lúc chưa có nhãn) nên vẫn trượt.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dò file cưỡng chế bị đổi
        id: diff
        run: |
          CHANGED=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            -- '.claude/policy.json' '.claude/settings.json' '.claude/hooks' '.github' || true)
          if [ -n "$CHANGED" ]; then echo "hit=true" >> "$GITHUB_OUTPUT"; else echo "hit=false" >> "$GITHUB_OUTPUT"; fi
          {
            echo "files<<___EOF___"
            echo "$CHANGED"
            echo "___EOF___"
          } >> "$GITHUB_OUTPUT"

      - name: Báo cáo
        if: steps.diff.outputs.hit == 'true'
        run: |
          echo "### PR này sửa cơ chế cưỡng chế governance" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.diff.outputs.files }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Đọc nhãn LIVE từ API. Không dùng github.event.pull_request.labels vì đó là
      # ảnh chụp lúc trigger — bấm "Re-run" sau khi gắn nhãn sẽ phát lại ảnh cũ.
      - name: Đọc nhãn hiện tại của PR
        id: label
        if: steps.diff.outputs.hit == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LABELS=$(gh pr view "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --json labels --jq '.labels[].name')
          echo "Nhãn đang có trên PR: ${LABELS:-(không có)}"
          if printf '%s\n' "$LABELS" | grep -qx 'governance-change'; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Chặn nếu chưa gắn nhãn governance-change
        if: steps.diff.outputs.hit == 'true' && steps.label.outputs.ok != 'true'
        run: |
          echo "::error::PR sửa file cưỡng chế governance mà chưa được duyệt."
          echo ""
          echo "File bị đổi:"
          echo "${{ steps.diff.outputs.files }}"
          echo ""
          echo "Đây là chủ ý? Gắn nhãn 'governance-change' vào PR rồi chạy lại check."
          echo "Gắn nhãn là thao tác trên giao diện GitHub — AI chạy trên máy không làm được."
          exit 1
